services:
  banco:
    image: postgres:17
    environment:
      POSTGRES_DB: bairro
      POSTGRES_USER: bairro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados-bairro:/var/lib/postgresql/data
    networks:
      - bairro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bairro -d bairro"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://banco:5432/bairro
      DB_USER: bairro
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      GESTOR_EMAIL: ${GESTOR_EMAIL:-gestor@bairro.test}
      GESTOR_SENHA: ${GESTOR_SENHA:-}
      CIDADAO_EMAIL: ${CIDADAO_EMAIL:-cidadao@bairro.test}
      CIDADAO_SENHA: ${CIDADAO_SENHA:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      banco:
        condition: service_healthy
    networks:
      - bairro
    restart: unless-stopped
networks:
  bairro:
volumes:
  dados-bairro:
